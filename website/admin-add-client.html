<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client | SIE Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            background-color: var(--surface);
        }
        .sidebar {
            width: 250px;
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: fixed;
        }
        .sidebar-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        .sidebar-nav a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background-color: var(--accent);
            color: white;
        }
        .sidebar-section {
            margin-bottom: 20px;
        }
        .sidebar-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding: 0 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-section-title:hover {
            color: var(--accent);
        }
        .sidebar-section-title .toggle-icon {
            transition: transform 0.3s ease;
        }
        .sidebar-section-title.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .submenu {
            padding-left: 15px;
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }
        .submenu.collapsed {
            max-height: 0;
            opacity: 0;
        }
        .submenu li {
            margin-bottom: 5px;
        }
        .submenu a {
            font-size: 0.9rem;
            padding: 8px 15px;
        }
        .main-content {
            margin-left: 250px;
            flex-grow: 1;
            padding: 40px;
            color: var(--text);
        }
        .main-content h1 {
            margin-bottom: 20px;
        }
        .form-container {
            max-width: 600px;
            background-color: var(--background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-primary {
            background-color: var(--accent);
            color: white;
            flex: 1;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: var(--border);
        }
        .error-message {
            color: #dc2626;
            background-color: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .success-message {
            color: #166534;
            background-color: #dcfce7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .help-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">SIE Admin</div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
            </ul>

            <div class="sidebar-section">
                <div class="sidebar-section-title" onclick="toggleSubmenu('clients-submenu')">
                    <span>Clients</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <ul id="clients-submenu" class="submenu">
                    <li><a href="admin-view-clients.html">View Clients</a></li>
                    <li><a href="admin-add-client.html" class="active">Add Client</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title" onclick="toggleSubmenu('sie-admin-submenu')">
                    <span>SIE Admin Control</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <ul id="sie-admin-submenu" class="submenu">
                    <li><a href="admin-manage-users.html">Manage Users</a></li>
                </ul>
            </div>
        </nav>
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="main-content">
        <h1 id="pageTitle">Add New Client</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">Create a new client company in the SIE platform.</p>

        <div class="form-container">
            <form id="clientForm">
                <div class="form-group">
                    <label for="clientCode">Client Code *</label>
                    <input type="text" id="clientCode" required maxlength="10" placeholder="e.g., ABC">
                    <div class="help-text">Unique identifier for the client (2-10 uppercase letters)</div>
                </div>

                <div class="form-group">
                    <label for="clientName">Client Name *</label>
                    <input type="text" id="clientName" required placeholder="e.g., ABC Company Inc.">
                    <div class="help-text">Full legal name of the client company</div>
                </div>

                <div class="form-group">
                    <label for="isActive">Status *</label>
                    <select id="isActive" required>
                        <option value="1" selected>Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-view-clients.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add Client</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const token = localStorage.getItem('sie_token');

        if (!token) {
            window.location.href = '/client_login.html';
        }

        // Toggle submenu function
        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            const title = submenu.previousElementSibling;
            submenu.classList.toggle('collapsed');
            title.classList.toggle('collapsed');
        }

        // Logout functionality
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('sie_token');
            localStorage.removeItem('sie_user');
            window.location.href = '/client_login.html';
        });

        // Elements
        const clientForm = document.getElementById('clientForm');
        const clientCodeInput = document.getElementById('clientCode');
        const clientNameInput = document.getElementById('clientName');
        const isActiveSelect = document.getElementById('isActive');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessageDiv = document.getElementById('errorMessage');
        const successMessageDiv = document.getElementById('successMessage');
        const pageTitle = document.getElementById('pageTitle');

        // Check if editing
        const urlParams = new URLSearchParams(window.location.search);
        const editCode = urlParams.get('edit');
        let isEditMode = false;

        if (editCode) {
            isEditMode = true;
            pageTitle.textContent = 'Edit Client';
            submitBtn.textContent = 'Update Client';
            loadClientData(editCode);
            clientCodeInput.disabled = true; // Can't change code when editing
        }

        // Load client data for editing
        async function loadClientData(code) {
            try {
                const response = await fetch(`${API_BASE}/admin/clients/${code}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load client data');
                }

                const data = await response.json();
                clientCodeInput.value = data.client_code;
                clientNameInput.value = data.client_name;
                isActiveSelect.value = data.is_active ? '1' : '0';
            } catch (err) {
                errorMessageDiv.textContent = 'Failed to load client data: ' + err.message;
                errorMessageDiv.style.display = 'block';
            }
        }

        // Auto-uppercase client code
        clientCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
        });

        // Form submission
        clientForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessageDiv.style.display = 'none';
            successMessageDiv.style.display = 'none';

            const clientCode = clientCodeInput.value.trim();
            const clientName = clientNameInput.value.trim();
            const isActive = parseInt(isActiveSelect.value);

            // Validation
            if (clientCode.length < 2) {
                errorMessageDiv.textContent = 'Client code must be at least 2 characters';
                errorMessageDiv.style.display = 'block';
                return;
            }

            if (clientName.length < 2) {
                errorMessageDiv.textContent = 'Client name must be at least 2 characters';
                errorMessageDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = isEditMode ? 'Updating...' : 'Adding...';

            try {
                const url = isEditMode
                    ? `${API_BASE}/admin/clients/${clientCode}`
                    : `${API_BASE}/admin/clients`;

                const method = isEditMode ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        client_code: clientCode,
                        client_name: clientName,
                        is_active: isActive
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Operation failed');
                }

                successMessageDiv.textContent = isEditMode
                    ? 'Client updated successfully!'
                    : 'Client added successfully!';
                successMessageDiv.style.display = 'block';

                if (!isEditMode) {
                    clientForm.reset();
                }

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'admin-view-clients.html';
                }, 2000);

            } catch (err) {
                errorMessageDiv.textContent = 'Error: ' + err.message;
                errorMessageDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isEditMode ? 'Update Client' : 'Add Client';
            }
        });
    </script>
</body>
</html>
