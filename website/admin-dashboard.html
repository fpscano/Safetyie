<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SIE - Safety Intelligence Engine</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            background-color: var(--surface);
        }
        .sidebar {
            width: 250px;
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        .sidebar-nav a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background-color: var(--accent);
            color: white;
        }
        .sidebar-section {
            margin-bottom: 20px;
        }
        .sidebar-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding: 0 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-section-title:hover {
            color: var(--accent);
        }
        .sidebar-section-title .toggle-icon {
            transition: transform 0.3s ease;
        }
        .sidebar-section-title.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .submenu {
            padding-left: 15px;
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }
        .submenu.collapsed {
            max-height: 0;
            opacity: 0;
        }
        .submenu li {
            margin-bottom: 5px;
        }
        .submenu a {
            font-size: 0.9rem;
            padding: 8px 15px;
        }
        .main-content {
            flex-grow: 1;
            padding: 40px;
            color: var(--text);
        }
        .main-content h1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">SIE Admin</div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
            </ul>

            <div class="sidebar-section">
                <div class="sidebar-section-title" onclick="toggleSubmenu('clients-submenu')">
                    <span>Clients</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <ul id="clients-submenu" class="submenu">
                    <li><a href="admin-view-clients.html">View Clients</a></li>
                    <li><a href="admin-add-client.html">Add Client</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title" onclick="toggleSubmenu('download-submenu')">
                    <span>Downloads</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <ul id="download-submenu" class="submenu">
                    <li><a href="admin-download-agents.html">Download Agents</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title" onclick="toggleSubmenu('sie-admin-submenu')">
                    <span>SIE Admin Control</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <ul id="sie-admin-submenu" class="submenu">
                    <li><a href="admin-manage-users.html">Manage Users</a></li>
                </ul>
            </div>
        </nav>
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="main-content">
        <h1>SIE Admin Dashboard</h1>
        <p>Select a client to view their dashboard:</p>

        <div id="loading" style="text-align: center; padding: 40px; color: #6c757d;">
            Loading clients...
        </div>

        <div id="errorMessage" style="color: #dc2626; padding: 20px; background-color: #fee2e2; border-radius: 8px; margin-top: 20px; display: none;"></div>

        <div id="clientsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;"></div>
    </div>

    <style>
        .client-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .client-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-color: var(--accent);
        }
        .client-code {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .client-name {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 15px;
        }
        .client-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-active {
            background-color: #dcfce7;
            color: #166534;
        }
        .status-inactive {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>

    <script>
        const API_BASE = '/api/v1';
        const token = localStorage.getItem('sie_token');
        const user = JSON.parse(localStorage.getItem('sie_user') || '{}');

        // Require SIE authentication for admin dashboard
        if (!token || user.user_type !== 'sie') {
            localStorage.removeItem('sie_token');
            localStorage.removeItem('sie_user');
            window.location.href = '/admin-login.html';
        }

        // Toggle submenu function
        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            const title = submenu.previousElementSibling;
            submenu.classList.toggle('collapsed');
            title.classList.toggle('collapsed');
        }

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('sie_token');
            localStorage.removeItem('sie_user');
            localStorage.removeItem('client_id');
            window.location.href = '/client_login.html';
        });

        // Load and display clients
        async function loadClients() {
            const loadingDiv = document.getElementById('loading');
            const errorMessageDiv = document.getElementById('errorMessage');
            const clientsGrid = document.getElementById('clientsGrid');

            try {
                const response = await fetch(`${API_BASE}/admin/clients`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load clients: ${response.status}`);
                }

                const clients = await response.json();
                loadingDiv.style.display = 'none';

                if (clients.length === 0) {
                    clientsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6c757d;">No clients found.</p>';
                    return;
                }

                clientsGrid.innerHTML = clients.map(client => `
                    <div class="client-card" onclick="viewClientDashboard('${client.client_code}')">
                        <div class="client-code">${client.client_code}</div>
                        <div class="client-name">${client.client_name || 'Unnamed Client'}</div>
                        <span class="client-status ${client.is_active ? 'status-active' : 'status-inactive'}">
                            ${client.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error loading clients:', err);
                loadingDiv.style.display = 'none';
                errorMessageDiv.textContent = `Error: ${err.message}. Please check your connection and try again.`;
                errorMessageDiv.style.display = 'block';
            }
        }

        function viewClientDashboard(clientCode) {
            window.location.href = `/client-dashboard.html?client=${clientCode}`;
        }

        // Load clients on page load
        loadClients();
    </script>
</body>
</html>
