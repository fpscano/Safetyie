<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIE Admin Login | Safety Intelligence Engine</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
        }

        .login-container {
            background: var(--background);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo img {
            height: 56px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 1.75rem;
            font-weight: 600;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.9375rem;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text);
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: var(--background);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .login-button {
            background: var(--accent);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 980px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 8px;
        }

        .login-button:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .login-button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.6;
            transform: scale(1);
        }

        .login-error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            display: none;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .login-error.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--accent-hover);
        }

        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .info-box strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <img src="images/SIE Logo.png" alt="SIE">
            </div>
            <div style="text-align: center;">
                <span class="admin-badge">SIE Admin Access</span>
            </div>
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">Sign in to access SIE administration</p>

            <div id="error-message" class="login-error"></div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-button" id="login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <a href="index.html">Back to Website</a>
                <span style="margin: 0 8px; color: var(--text-secondary);">|</span>
                <a href="client_login.html">Client Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorDiv = document.getElementById('error-message');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Username and password are required.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    const data = await response.json();

                    // Store token and user data
                    localStorage.setItem('sie_token', data.access_token);
                    localStorage.setItem('sie_user', JSON.stringify(data.user));

                    // Redirect to admin dashboard
                    window.location.href = '/admin-dashboard.html';
                } else {
                    let message = 'Invalid credentials.';
                    try {
                        const errorData = await response.json();
                        message = errorData.detail || message;
                    } catch {}
                    showError(message);
                }
            } catch (err) {
                console.error('Login error:', err);
                showError('Connection error. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Check if already logged in as SIE admin
        const existingToken = localStorage.getItem('sie_token');
        const existingUser = localStorage.getItem('sie_user');
        if (existingToken && existingUser) {
            try {
                const user = JSON.parse(existingUser);
                if (user.user_type === 'sie') {
                    // Already logged in as SIE admin, redirect to dashboard
                    window.location.href = '/admin-dashboard.html';
                }
            } catch (e) {
                // Invalid user data, clear it
                localStorage.removeItem('sie_token');
                localStorage.removeItem('sie_user');
            }
        }
    </script>
</body>
</html>
